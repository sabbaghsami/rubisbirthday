<script src="itinerary-content.js?v=photos-1"></script>
<script>
const pins = [...document.querySelectorAll('.pin')];
const stops = [...document.querySelectorAll('details')];
function highlight(id) {
  pins.forEach(pin => { const active = pin.dataset.stop === id; pin.classList.toggle('active', active); pin.setAttribute('aria-pressed', String(active)); });
}
pins.forEach(pin => pin.addEventListener('click', () => {
  const selected = document.getElementById('stop-' + pin.dataset.stop);
  stops.forEach(stop => stop.open = stop === selected);
  highlight(pin.dataset.stop);
  if (matchMedia('(max-width: 760px)').matches) selected.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth', block:'center'});
}));
stops.forEach(stop => stop.addEventListener('toggle', () => {
  if (stop.open) highlight(stop.id.replace('stop-', ''));
  else if (!stops.some(item => item.open)) highlight('');
}));
</script>
